<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<!-- EmsiBuddy Zeichentrick-Engine. Liest window.STORY (Storyboard-JSON, siehe README.md) und zeichnet render(t). -->
<style>
@font-face{font-family:"Bricolage";src:url(assets/bricolage-grotesque-latin-wght-normal.woff2) format("woff2");font-weight:200 800}
@font-face{font-family:"Nunito";src:url(assets/nunito-latin-wght-normal.woff2) format("woff2");font-weight:200 1000}
:root{--ink:#10222B;--teal:#0E7490;--honey:#F0B03A;--paper:#F7F9F8;--grid:#DCE6E4;--soft:#5B6B70}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
#stage{position:absolute;inset:0;background-color:var(--paper);
 background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);background-size:54px 54px}
.el{position:absolute;opacity:0}
.titel{left:90px;right:90px;font-family:"Bricolage";font-weight:800;color:var(--ink);line-height:1.02;letter-spacing:-1px}
.unter{left:90px;right:90px;font-family:"Nunito";font-weight:600;color:var(--soft);font-size:46px;line-height:1.3}
.klein{left:90px;right:90px;font-family:"Nunito";font-weight:800;color:var(--teal);font-size:36px;letter-spacing:3px;text-transform:uppercase}
u{text-decoration:none;background:linear-gradient(transparent 68%,var(--honey) 68%,var(--honey) 90%,transparent 90%)}
b{color:var(--teal);font-weight:inherit}
.blase{background:#fff;border:6px solid var(--ink);border-radius:48px;padding:36px 44px;font-family:"Nunito";font-weight:900;font-size:58px;color:var(--ink);max-width:760px}
.blase:after{content:"";position:absolute;left:var(--zx,90px);bottom:-46px;border:22px solid transparent;border-top:30px solid var(--ink)}
.uhr{left:90px;font-family:"Bricolage";font-weight:800;font-size:150px;color:var(--teal)}
.logo{left:90px;top:120px;display:flex;align-items:center;gap:22px;font-family:"Nunito";font-weight:900;font-size:64px;color:var(--ink)}
.logo img{width:96px;height:96px;border-radius:22px}
.cta{left:90px;top:1600px;background:var(--teal);color:#fff;font-family:"Nunito";font-weight:900;font-size:46px;padding:30px 48px;border-radius:999px;white-space:nowrap}
svg{position:absolute;left:0;top:0}
</style></head><body>
<div id="stage"><svg id="scene" width="1080" height="1920" viewBox="0 0 1080 1920"></svg><div id="layer"></div></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const lerp=(a,b,k)=>a+(b-a)*k;
const win=(t,a,b,f=.35)=>cl(Math.min((t-a)/f,(b-t)/f));
const INK="#10222B";

// ---------- Strichfiguren
function figure(p,sc,kid){
 const L=(a,b)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${INK}" stroke-width="${16*sc}" stroke-linecap="round"/>`;
 const [hx,hy]=p.head;
 let hair=kid?`<path d="M${hx-30*sc} ${hy-50*sc} Q${hx} ${hy-95*sc} ${hx+34*sc} ${hy-52*sc}" stroke="${INK}" stroke-width="${12*sc}" fill="none" stroke-linecap="round"/><circle cx="${hx+52*sc}" cy="${hy-30*sc}" r="${16*sc}" fill="#F0B03A" stroke="${INK}" stroke-width="${7*sc}"/>`:"";
 return L(p.neck,p.hip)+L(p.neck,p.le)+L(p.le,p.lh)+L(p.neck,p.re)+L(p.re,p.rh)+L(p.hip,p.lk)+L(p.lk,p.lf)+L(p.hip,p.rk)+L(p.rk,p.rf)+
  `<circle cx="${hx}" cy="${hy}" r="${58*sc}" fill="#fff" stroke="${INK}" stroke-width="${14*sc}"/>`+hair;
}
function face(p,mood,sc){const [x,y]=p.head,s=sc;
 const eye=(dx)=>`<circle cx="${x+dx*s}" cy="${y-12*s}" r="${7*s}" fill="${INK}"/>`;
 if(mood==="froh")return eye(-20)+eye(20)+`<path d="M${x-22*s} ${y+10*s} Q${x} ${y+34*s} ${x+22*s} ${y+10*s}" stroke="${INK}" stroke-width="${8*s}" fill="none" stroke-linecap="round"/>`;
 if(mood==="schock")return `<circle cx="${x-20*s}" cy="${y-10*s}" r="${11*s}" fill="none" stroke="${INK}" stroke-width="${6*s}"/><circle cx="${x+20*s}" cy="${y-10*s}" r="${11*s}" fill="none" stroke="${INK}" stroke-width="${6*s}"/><ellipse cx="${x}" cy="${y+28*s}" rx="${10*s}" ry="${13*s}" fill="${INK}"/>`;
 if(mood==="traurig")return `<line x1="${x-30*s}" y1="${y-8*s}" x2="${x-10*s}" y2="${y-8*s}" stroke="${INK}" stroke-width="${7*s}"/><line x1="${x+10*s}" y1="${y-8*s}" x2="${x+30*s}" y2="${y-8*s}" stroke="${INK}" stroke-width="${7*s}"/><path d="M${x-18*s} ${y+30*s} Q${x} ${y+14*s} ${x+18*s} ${y+30*s}" stroke="${INK}" stroke-width="${8*s}" fill="none" stroke-linecap="round"/>`;
 if(mood==="genervt")return `<line x1="${x-30*s}" y1="${y-14*s}" x2="${x-8*s}" y2="${y-6*s}" stroke="${INK}" stroke-width="${7*s}"/><line x1="${x+8*s}" y1="${y-6*s}" x2="${x+30*s}" y2="${y-14*s}" stroke="${INK}" stroke-width="${7*s}"/><line x1="${x-16*s}" y1="${y+24*s}" x2="${x+16*s}" y2="${y+24*s}" stroke="${INK}" stroke-width="${8*s}" stroke-linecap="round"/>`;
 if(mood==="verwirrt")return eye(-20)+eye(20)+`<path d="M${x-20*s} ${y+26*s} Q${x-8*s} ${y+16*s} ${x} ${y+26*s} T${x+20*s} ${y+26*s}" stroke="${INK}" stroke-width="${7*s}" fill="none"/><text x="${x+50*s}" y="${y-60*s}" font-family="Bricolage" font-weight="800" font-size="${80*s}" fill="#0E7490">?</text>`;
 return eye(-20)+eye(20)+`<line x1="${x-14*s}" y1="${y+24*s}" x2="${x+14*s}" y2="${y+24*s}" stroke="${INK}" stroke-width="${8*s}" stroke-linecap="round"/>`;
}
function pose(name,x,y,t,k,sc){ // x,y = Hüfte; k = Fortschritt 0..1 in der Szene
 const S=v=>v*sc, P=(dx,dy)=>[x+S(dx),y+S(dy)];
 const sway=Math.sin(t*2.2)*4;
 const base={head:P(8,-330+sway),neck:P(4,-262),hip:[x,y],le:P(40,-180),lh:P(55,-95),re:P(-40,-180),rh:P(-55,-95),lk:P(30,120),lf:P(40,235),rk:P(-30,120),rf:P(-40,235)};
 if(name==="geht"){const s=Math.sin(t*9)*38,c=Math.cos(t*9)*30;
  return {head:P(8,-330),neck:P(4,-262),hip:[x,y],le:P(s*.6,-180),lh:P(s,-100),re:P(-s*.6,-180),rh:P(-s,-100),lk:P(s*.7,120),lf:P(s*1.3,235+Math.min(0,c)),rk:P(-s*.7,120),rf:P(-s*1.3,235+Math.min(0,-c))};}
 if(name==="sofa"){const b=ease(cl(k*3));
  return {head:P(-lerp(0,150,b),-lerp(330,250,b)),neck:P(-lerp(0,110,b),-lerp(262,190,b)),hip:[x,y],le:P(-lerp(40,230,b),-lerp(180,240,b)),lh:P(-lerp(55,330,b),-lerp(95,300,b)),re:P(lerp(-40,60,b),-lerp(180,170,b)),rh:P(lerp(-55,170,b),-lerp(95,210,b)),lk:P(lerp(30,140,b),lerp(120,-10,b)),lf:P(lerp(40,300,b),lerp(235,40,b)),rk:P(lerp(-30,150,b),lerp(120,20,b)),rf:P(lerp(-40,320,b),lerp(235,80,b))};}
 if(name==="tisch"){const sh=Math.sin(t*6)*6;
  return {head:P(70,-250+sh),neck:P(30,-200),hip:[x,y],le:P(120,-110),lh:P(95,-230+sh),re:P(150,-120),rh:P(120,-240+sh),lk:P(140,10),lf:P(140,200),rk:P(130,20),rf:P(120,200)};}
 if(name==="sitzt"){ // aufrecht am Tisch, schreibt
  const w=Math.sin(t*14)*8;
  return {head:P(20,-300),neck:P(15,-232),hip:[x,y],le:P(110,-140),lh:P(210+w,-120),re:P(90,-150),rh:P(190,-110),lk:P(140,10),lf:P(140,200),rk:P(130,20),rf:P(120,200)};}
 if(name==="redet"){const g=Math.sin(t*5);
  return {...base,re:P(-60,-200),rh:P(-120,-260+g*30),le:P(70,-190),lh:P(150,-230-g*25)};}
 if(name==="jubelt"){const j=Math.abs(Math.sin(t*5))*30;
  const o=v=>[v[0],v[1]-S(j)];
  return Object.fromEntries(Object.entries({...base,le:P(70,-300),lh:P(110,-420),re:P(-70,-300),rh:P(-110,-420)}).map(([a,v])=>[a,o(v)]));}
 if(name==="zuckt"){ // Schulterzucken
  return {...base,le:P(80,-230),lh:P(140,-300),re:P(-80,-230),rh:P(-140,-300)};}
 if(name==="handy"){
  return {...base,le:P(60,-190),lh:P(100,-250),re:P(-20,-190),rh:P(60,-250)};}
 return base; // steht
}
function prop(name,o){
 if(name==="sofa")return `<g opacity="${o}"><rect x="300" y="1240" width="660" height="230" rx="60" fill="#0E7490"/><rect x="260" y="1150" width="140" height="330" rx="60" fill="#0B5F76"/><rect x="860" y="1150" width="140" height="330" rx="60" fill="#0B5F76"/><rect x="380" y="1090" width="500" height="200" rx="60" fill="#13879F"/><rect x="330" y="1470" width="30" height="60" fill="${INK}"/><rect x="900" y="1470" width="30" height="60" fill="${INK}"/></g>`;
 if(name==="tisch")return `<g opacity="${o}"><rect x="330" y="1300" width="620" height="26" rx="13" fill="${INK}"/><line x1="380" y1="1326" x2="380" y2="1600" stroke="${INK}" stroke-width="18"/><line x1="900" y1="1326" x2="900" y2="1600" stroke="${INK}" stroke-width="18"/><rect x="560" y="1250" width="230" height="50" rx="6" fill="#fff" stroke="${INK}" stroke-width="6" transform="rotate(-6 670 1275)"/><rect x="170" y="1420" width="200" height="22" rx="11" fill="#5B6B70"/><line x1="200" y1="1442" x2="200" y2="1600" stroke="#5B6B70" stroke-width="14"/><line x1="340" y1="1442" x2="340" y2="1600" stroke="#5B6B70" stroke-width="14"/></g>`;
 if(name==="boden")return `<line x1="60" y1="1660" x2="1020" y2="1660" stroke="${INK}" stroke-width="8" stroke-linecap="round" opacity="${o*.5}"/>`;
 return "";
}
function phone(p,o,sc){const [x,y]=p.rh;return `<g opacity="${o}"><rect x="${x-10*sc}" y="${y-110*sc}" width="${80*sc}" height="${140*sc}" rx="${14*sc}" fill="#fff" stroke="${INK}" stroke-width="${8*sc}"/><rect x="${x+2*sc}" y="${y-96*sc}" width="${56*sc}" height="${90*sc}" rx="6" fill="#0E7490" opacity=".25"/></g>`;}

// ---------- Aufbau aus dem Storyboard
const ST=window.STORY; const els=[];
function mk(cls,html,style){const d=document.createElement("div");d.className="el "+cls;d.innerHTML=html;Object.assign(d.style,style||{});$("layer").appendChild(d);return d;}
ST.szenen.forEach((s,i)=>{
 s._els=[];
 (s.texte||[]).forEach((x,n)=>{const st={top:x.oben+"px"};if(x.groesse)st.fontSize=x.groesse+"px";if(x.rechts)st.right=x.rechts+"px";
  s._els.push({d:mk(x.art||"titel",x.text,st),delay:.15+n*.35});});
 if(s.blase){const b=s.blase;const d=mk("blase",b.text,{top:b.oben+"px",[b.links!=null?"left":"right"]:(b.links??70)+"px"});if(b.zipfel)d.style.setProperty("--zx",b.zipfel+"px");s._els.push({d,delay:b.ab??.3,pop:true});}
 if(s.uhr)s._els.push({d:mk("uhr",s.uhr.text,{top:s.uhr.oben+"px"}),delay:.5});
 if(s.logo)s._els.push({d:mk("logo",`<img src="assets/logo.png"><span>Emsi<span style="color:#0E7490">Buddy</span></span>`),delay:0});
 if(s.cta)s._els.push({d:mk("cta",s.cta),delay:1.0});
 (s.bilder||[]).forEach((b,n)=>{const d=mk("",`<img src="assets/${b.datei}" style="width:100%">`,{left:b.x+"px",top:b.oben+"px",width:b.breite+"px"});s._els.push({d,delay:b.ab??(.3+n*.4),huepf:b.huepf,pop:true});});
});

function render(t){
 let svg="";
 ST.szenen.forEach(s=>{
  const end=s.bis+(s===ST.szenen[ST.szenen.length-1]?2:0);
  const o=win(t,s.von,end,.35), k=cl((t-s.von)/(s.bis-s.von));
  if(o>0){
   (s.kulisse||[]).forEach(p=>svg+=prop(p,o));
   (s.figuren||[]).forEach(f=>{
    const sc=f.kind?.72:1; let x=f.x, y=f.y??(f.kind?1470:1430);
    if(f.von_x!=null)x=lerp(f.von_x,f.x,ease(cl((t-s.von)/(f.dauer||1.8))));
    let posename=f.pose; if(f.dann&&t-s.von>(f.dauer||1.8))posename=f.dann;
    const p=pose(posename,x,y,t,(t-s.von-(f.dauer||0))/(s.bis-s.von),sc);
    svg+=`<g opacity="${o}">${figure(p,sc,f.kind)}${face(p,f.stimmung||"neutral",sc)}${posename==="handy"?phone(p,o,sc):""}</g>`;
    if(f.schreck&&t-s.von<1.2){const h=p.head,q=win(t,s.von,s.von+1.2,.15);svg+=`<g opacity="${q}" stroke="#F0B03A" stroke-width="10" stroke-linecap="round"><line x1="${h[0]-90}" y1="${h[1]-90}" x2="${h[0]-60}" y2="${h[1]-60}"/><line x1="${h[0]}" y1="${h[1]-120}" x2="${h[0]}" y2="${h[1]-80}"/><line x1="${h[0]+90}" y1="${h[1]-90}" x2="${h[0]+60}" y2="${h[1]-60}"/></g>`;}
   });
   if(s.blitz){const q=win(t,s.von+s.blitz,s.von+s.blitz+.25,.08);svg+=`<rect x="0" y="0" width="1080" height="1920" fill="#fff" opacity="${q*.85}"/>`;}
  }
  s._els.forEach(e=>{const a=s.von+e.delay;const q=win(t,a,end,.35);e.d.style.opacity=q;
   let tr=`translateY(${(1-q)*40}px)`;
   if(e.pop)tr+=` scale(${lerp(.6,1,ease(cl((t-a)/.3)))})`;
   if(e.huepf)tr+=` translateY(${-Math.abs(Math.sin((t-a)*3))*35}px)`;
   e.d.style.transform=tr;});
 });
 $("scene").innerHTML=svg;
}
render(0);
</script></body></html>
